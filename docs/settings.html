<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データ管理 | Roast Note</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="./index.html" class="home-link">HOME</a>
    <h1><a href="./index.html" class="logo-link">Roast Note</a></h1>
    <h2>データ管理</h2>
  </header>

  <main class="container">
    <section class="card">
      <h3>エクスポート</h3>
      <p>登録データをJSONファイルとして保存します。</p>
      <button id="export-btn">エクスポート</button>
    </section>

    <section class="card">
      <h3>インポート</h3>
      <p class="warning">現在のデータは上書きされます。</p>
      <input type="file" id="import-file" accept="application/json">
      <button id="import-btn" class="danger">インポート</button>
    </section>

    <section class="card">
      <h3>全削除</h3>
      <p class="warning">登録データをすべて削除します。</p>
      <button id="delete-all-btn" class="danger">全削除</button>
    </section>
  </main>

  <script src="./js/db.js"></script>
  <script src="./js/settings.js"></script>
</body>
</html>
