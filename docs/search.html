<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索 | Roast Note</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="./index.html" class="home-link">HOME</a>
    <h1><a href="./index.html" class="logo-link">Roast Note</a></h1>
    <h2>検索</h2>
  </header>

  <main class="container">
    <input type="text" id="searchInput" placeholder="名前・コメント・タグで検索">

    <div class="search-filters">
      <select id="ratingFilter">
        <option value="">評価すべて</option>
        <option value="5">★★★★★</option>
        <option value="4">★★★★</option>
        <option value="3">★★★</option>
        <option value="2">★★</option>
        <option value="1">★</option>
        <option value="none">評価なし</option>
      </select>

      <input type="text" id="originFilter" placeholder="国名で検索">
    </div>

    <section class="panel">
      <h3>タグで絞り込み</h3>
      <div id="tag-filter-list" class="tag-list"></div>
    </section>

    <section id="output" class="note-list" aria-live="polite"></section>
  </main>

  <script src="./js/db.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/search.js"></script>
</body>
</html>
